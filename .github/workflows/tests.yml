name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project (CPU torch + all extras + dev)
        run: |
          python -m pip install --upgrade pip
          # 1. CPU-only torch wheel (~200 MB vs ~2 GB CUDA build).
          pip install torch==2.5.0 --index-url https://download.pytorch.org/whl/cpu
          # 2. torch-scatter / torch-sparse have no PyPI wheels; their sdists need
          #    torch at build time and pip's build isolation hides it. Install the
          #    prebuilt CPU wheels from PyG's wheel index.
          pip install torch-scatter==2.1.2 torch-sparse==0.6.18 \
            -f https://data.pyg.org/whl/torch-2.5.0+cpu.html
          # 3. Remaining extras (torch + scatter + sparse already satisfied).
          pip install -e ".[neo4j,gnn,api,dev]"

      - name: Lint (ruff)
        # ruff and mypy are declared in the `dev` extra and were installed by the
        # step above, but nothing ever ran them. Non-blocking for now so this does
        # not fail the build on pre-existing findings; drop `continue-on-error`
        # once the tree is clean.
        continue-on-error: true
        run: ruff check saag/ cli/ api/ reproduce/ scripts/

      - name: Run pytest
        # `-m "not integration"` is deliberate: the integration tests need a live
        # Neo4j at bolt://localhost:7687, which this job does not provision. They
        # do skip themselves on a failed connection, but deselecting says so up
        # front rather than reporting skips that look like flakes.
        run: pytest --tb=short -q -m "not integration"

      - name: Documentation links
        run: python scripts/check_doc_links.py

      - name: Manuscript reconciliation
        # results/ is gitignored, so on a clean checkout every artifact is absent.
        # --allow-missing keeps that from failing the build while still exercising
        # the parser and the corpus-derived Table 4 check, which needs no artifact.
        run: python reproduce/reconcile_manuscript.py --allow-missing --verbose
