# =============================================================================
# Scenario 18 — Telecom RAN Control Plane (Aggregation Funnel)
# =============================================================================
# Domain   : 5G radio-access-network management plane. Element managers on RAN
#            sites publish telemetry and alarm streams that a small set of core
#            network functions aggregates and acts on.
# Scale    : 120 apps, 55 topics, 8 brokers, 20 nodes
# Purpose  : Add a LOSO fold whose criticality spine comes from *convergence*
#            rather than from a hub broker. No existing scenario has many
#            publishers converging on comparatively few aggregation topics; the
#            corpus otherwise pairs high fan-in with a hub-and-spoke broker
#            layout, which conflates the two.
#
# Topology fingerprint:
#   • Many publishers per topic (aggregation funnel), moderate subscriber sets
#   • Publish-dominant role mix — element managers emit far more than they consume
#   • Deep manager -> aggregator -> core-function chains
#   • Deadline-driven: priority skewed high, reliability mostly RELIABLE
#   • Moderate library sharing (a common telemetry-encoding stack)
#
# Expected analysis outcomes:
#   • Aggregation topics and the core functions behind them dominate betweenness
#   • Criticality concentrated in ~12 % of applications
#   • Distinct from hub_and_spoke: concentration is at topics, not brokers
#
# Usage:
#   PYTHONPATH=. python cli/generate_graph.py --config data/scenarios/scenario_18_telecom_ran.yaml \
#          --output output/telecom_ran_system.json
# =============================================================================

graph:
  seed: 1801
  domain: telecom
  scenario: telecom_ran

  counts:
    nodes: 20
    applications: 120
    libraries: 22
    topics: 55
    brokers: 8

  # ---------------------------------------------------------------------------
  # NODE STATISTICS — RAN sites host a fairly even spread of element managers
  # ---------------------------------------------------------------------------
  node_stats:
    applications_per_node:
      mean: 6.0
      median: 6.0
      std: 2.5
      min: 2
      max: 12
      q1: 4.0
      q3: 8.0
      iqr: 4.0

  # ---------------------------------------------------------------------------
  # APPLICATION STATISTICS — Publish-dominant: telemetry flows one way
  # ---------------------------------------------------------------------------
  application_stats:
    direct_publish_count:
      mean: 2.2
      median: 2.0
      std: 1.2
      min: 0
      max: 6
      q1: 1.0
      q3: 3.0
      iqr: 2.0

    direct_subscribe_count:
      mean: 1.6
      median: 1.0
      std: 1.1
      min: 0
      max: 5
      q1: 1.0
      q3: 2.0
      iqr: 1.0

    total_publish_count_including_libraries:
      mean: 2.8
      median: 3.0
      std: 1.4
      min: 0
      max: 8
      q1: 2.0
      q3: 4.0
      iqr: 2.0

    total_subscribe_count_including_libraries:
      mean: 2.3
      median: 2.0
      std: 1.3
      min: 0
      max: 7
      q1: 1.0
      q3: 3.0
      iqr: 2.0

    # Element managers outnumber aggregators and core functions
    app_role_distribution:
      total_count: 120
      category_counts:
        pub: 52       # RAN element managers, probe agents
        sub: 30       # Core network functions, alarm correlators
        pubsub: 38    # Regional aggregators, policy controllers
      mode: pub
      mode_count: 52
      mode_percentage: 43.3

    # ~11.7 % critical — aggregators and the core functions behind them
    app_criticality_distribution:
      total_count: 120
      category_counts:
        HIGH: 36
        MEDIUM: 54
        LOW: 30
      mode: MEDIUM
      mode_count: 54
      mode_percentage: 45.0

    # Application hotstandby redundancy distribution (Categorical)
    # Values: true (multi-node redundant active/standby), false (standalone)
    app_hotstandby_distribution:
      total_count: 120
      category_counts:
        true: 48
        false: 72
      mode: false
      mode_count: 72
      mode_percentage: 60.0

  # ---------------------------------------------------------------------------
  # LIBRARY STATISTICS — Shared telemetry-encoding and 3GPP model stack
  # ---------------------------------------------------------------------------
  library_stats:
