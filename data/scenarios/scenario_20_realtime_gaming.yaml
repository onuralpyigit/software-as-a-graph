# =============================================================================
# Scenario 20 — Real-Time Multiplayer Game Backend (Dense Mesh, Flat Spectrum)
# =============================================================================
# Domain   : Session-oriented multiplayer backend. Match, state-replication,
#            matchmaking and telemetry services exchange high-rate updates.
# Scale    : 75 apps, 38 topics, 5 brokers, 12 nodes
# Purpose  : Add the corpus's only densely-meshed, low-latency, best-effort
#            regime. Every existing scenario is either sparse (microservices)
#            or concentrated (hub, enterprise, IoT); none is dense *and* flat.
#            A LOSO fold the structural baselines should find genuinely hard is
#            worth having — a corpus of only spine-shaped systems flatters any
#            centrality score.
#
# Topology fingerprint:
#   • pubsub-dominant role mix; most services both emit and consume
#   • Many publishers AND many subscribers per topic (shared world state)
#   • Highest library sharing in the corpus (one engine/netcode stack)
#   • VOLATILE + BEST_EFFORT dominant — stale frames are dropped, not queued
#   • Smallest median payload after SCADA (delta-encoded state)
#
# Expected analysis outcomes:
#   • Flat betweenness spectrum; low Gini — few structural bottlenecks
#   • Only ~5 % critical (session directory, authoritative state store)
#   • The hardest LOSO fold for training-free centrality by construction
#
# Usage:
#   PYTHONPATH=. python cli/generate_graph.py --config data/scenarios/scenario_20_realtime_gaming.yaml \
#          --output output/realtime_gaming_system.json
# =============================================================================

graph:
  seed: 2003
  domain: gaming
  scenario: realtime_gaming

  counts:
    nodes: 12
    applications: 75
    libraries: 28
    topics: 38
    brokers: 5

