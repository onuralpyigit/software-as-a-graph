# =============================================================================
# Scenario 17 — Air Traffic Management (ATM) / ICAO SWIM — XLarge Scale
# =============================================================================
# Domain   : Safety-critical Air Traffic Management (ICAO Global Concept)
# Scale    : 156 apps, 162 topics, 30 brokers, 48 nodes — largest of five ATM
#            scale variants (scenario_14/10/15/16/17 = tiny/small/medium/
#            large/xlarge) sharing the same distributional shape.
# Purpose  : One point on a controlled scale sweep for the Middleware 2026
#            Industrial Track paper (docs/research/middleware2026/industry/
#            draft.md §5.2). All five variants copy the *_stats blocks from
#            scenario_10_atm_system.yaml verbatim — same QoS mix, fan-out
#            shape, and criticality proportion — and vary only graph.counts,
#            so scale is the sole independent variable across the sweep.
#
# Topology fingerprint: identical to scenario_10 (see that file), just many
# more instances of the same six ATM app-role names.
#
# Usage:
#   PYTHONPATH=. python cli/generate_graph.py --config data/scenarios/scenario_17_atm_xlarge.yaml \
#          --output data/scenarios/atm_system_xlarge.json
# =============================================================================

graph:
  seed: 4217
  domain: air_traffic_management
  scenario: icao_global_atm_concept

  counts:
    nodes: 48
    applications: 156
    libraries: 48
    topics: 162
    brokers: 30

