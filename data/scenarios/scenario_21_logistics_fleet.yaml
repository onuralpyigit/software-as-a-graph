# =============================================================================
# Scenario 21 — Logistics Fleet Telemetry (Regionally Partitioned Bridges)
# =============================================================================
# Domain   : Fleet and freight operations. Vehicle and depot agents report over
#            intermittent links into regional gateways, which bridge into
#            central routing, ETA and compliance planning.
# Scale    : 110 apps, 50 topics, 7 brokers, 18 nodes
# Purpose  : Add a LOSO fold whose critical set is a *bridge* set rather than a
#            hub or a funnel. Regional partitioning with a handful of
#            cross-partition gateways produces genuine articulation structure —
#            the regime A(v) is meant to detect, and one the corpus currently
#            exercises only incidentally.
#
# Topology fingerprint:
#   • Partitioned by region, joined by a small number of gateway applications
#   • Store-and-forward links: TRANSIENT_LOCAL and PERSISTENT dominate
#   • Largest payloads in the corpus (batched telemetry and manifest documents)
#   • Balanced role mix; moderate coupling on both sides
#
# Expected analysis outcomes:
#   • Regional gateways are articulation points with high betweenness
#   • ~11 % critical, concentrated on the bridges rather than the leaves
#   • Distinct from telecom_ran: concentration is at applications, not topics
#
# Usage:
#   PYTHONPATH=. python cli/generate_graph.py --config data/scenarios/scenario_21_logistics_fleet.yaml \
#          --output output/logistics_fleet_system.json
# =============================================================================

graph:
  seed: 2104
  domain: logistics
  scenario: logistics_fleet

  counts:
    nodes: 18
